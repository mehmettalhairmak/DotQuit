<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>DotQuit</title>
  <defs>
    <!-- macOS continuous-corner squircle, 800×800 centered -->
    <path id="squircle" d="M385.63 112 H638.37 C717.16 112 756.56 115.83 792.08 123.72 L798.96 125.41 C845.26 142.26 881.74 178.74 898.59 225.04 L900.28 231.92 C908.17 267.44 912 306.84 912 385.63 V638.37 C912 717.16 908.17 756.56 900.28 792.08 L898.59 798.96 C881.74 845.26 845.26 881.74 798.96 898.59 L792.08 900.28 C756.56 908.17 717.16 912 638.37 912 H385.63 C306.84 912 267.44 908.17 231.92 900.28 L225.04 898.59 C178.74 881.74 142.26 845.26 125.41 798.96 L123.72 792.08 C115.83 756.56 112 717.16 112 638.37 V385.63 C112 306.84 115.83 267.44 123.72 231.92 L125.41 225.04 C142.26 178.74 178.74 142.26 225.04 125.41 L231.92 123.72 C267.44 115.83 306.84 112 385.63 112 Z"/>
    <clipPath id="clipSquircle"><use href="#squircle"/></clipPath>

    <!-- Window card: 650×470; window + dot group spans y 242–782, centered on 512 -->
    <rect id="win" x="187" y="242" width="650" height="470" rx="54"/>
    <clipPath id="clipWin"><use href="#win"/></clipPath>

    <!-- Base: graphite -->
    <linearGradient id="base" x1="0" y1="112" x2="0" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1E21"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>

    <!-- Squircle rim light -->
    <linearGradient id="rim" x1="0" y1="112" x2="0" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.12" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Window: dark acrylic -->
    <linearGradient id="winFill" x1="0" y1="242" x2="0" y2="712" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E2E33" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#232327" stop-opacity="0.80"/>
    </linearGradient>
    <!-- Frosted glass rim: crisp inner light edge, brighter at top -->
    <linearGradient id="winRim" x1="0" y1="242" x2="0" y2="712" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Dock light glow -->
    <radialGradient id="dockGlow" cx="512" cy="768" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#F5F5F7" stop-opacity="0.30"/>
      <stop offset="0.35" stop-color="#F5F5F7" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#F5F5F7" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Base squircle -->
  <use href="#squircle" fill="url(#base)" filter="url(#shadow)"/>
  <g clip-path="url(#clipSquircle)">
    <use href="#squircle" fill="none" stroke="url(#rim)" stroke-width="2"/>
  </g>

  <!-- Window card -->
  <use href="#win" fill="url(#winFill)" filter="url(#winShadow)"/>
  <g clip-path="url(#clipWin)">
    <!-- Title bar tint + hairline divider -->
    <rect x="187" y="242" width="650" height="170" fill="#FFFFFF" fill-opacity="0.035"/>
    <rect x="187" y="411" width="650" height="1.5" fill="#000000" fill-opacity="0.35"/>
  </g>
  <!-- Outer dark keyline, then inner frosted highlight -->
  <use href="#win" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="188.25" y="243.25" width="647.5" height="467.5" rx="52.75" fill="none" stroke="url(#winRim)" stroke-width="1.5"/>

  <!-- Traffic lights -->
  <!-- Close: hero -->
  <circle cx="285" cy="327" r="45" fill="#FF5F56" opacity="0.6" filter="url(#glow)"/>
  <circle cx="285" cy="327" r="45" fill="#FF5F56"/>
  <circle cx="285" cy="327" r="44.25" fill="none" stroke="#E0443E" stroke-width="1.5"/>
  <path d="M269 311 L301 343 M301 311 L269 343" stroke="#4D0000" stroke-opacity="0.8" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Minimize / zoom: ghosted -->
  <circle cx="410" cy="327" r="45" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
  <circle cx="535" cy="327" r="45" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- Dock indicator light -->
  <circle cx="512" cy="768" r="46" fill="url(#dockGlow)"/>
  <circle cx="512" cy="768" r="13" fill="#F5F5F7" fill-opacity="0.85"/>
</svg>
