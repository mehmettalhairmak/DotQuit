<svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist macOS Window Card -->
  <rect x="2.5" y="2.5" width="17" height="12" rx="2.5" stroke="black" stroke-width="1.3" />

  <!-- 3 Optically Balanced Traffic Lights -->
  <!-- 1. Close Button (Solid Hero Dot) -->
  <circle cx="5.5" cy="5.8" r="1.1" fill="black" />
  <!-- 2 & 3. Passive Buttons (Subtle Outlines, Optically Scaled) -->
  <circle cx="8.2" cy="5.8" r="0.75" stroke="black" stroke-width="0.55" />
  <circle cx="10.7" cy="5.8" r="0.75" stroke="black" stroke-width="0.55" />

  <!-- The Dock Indicator Dot Below -->
  <circle cx="11" cy="18.2" r="1.4" fill="black" />
</svg>
